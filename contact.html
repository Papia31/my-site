<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>კონტაქტი</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <div class="contact-wrapper">
        <form class="contact-form">
          <label for="name">სახელი</label>
          <input type="text" id="name" placeholder="შენი სახელი" required />
          <br />
          <label for="email">ელოფსტა</label>
          <input type="email" name="email" placeholder="ელფოსტა" required />
          <br />
          <label for="text">ტექსტი</label>
          <input type="text" required />
          <br />
          <button type="submit">გაგზავნა</button>
        </form>
        <div class="contact-info">
          <h2>Itworks</h2>
          <p>
            საბურთალო - ვაჟა-ფშაველას 78ა (მეტროსთან) 591-84-44-48
            <br />
            გლდანი - ილია ვეკუას 19ა (მეტროსთან) 2-12-13-30 <br />
            ელფოსტა-info@itw.ge
          </p>
        </div>
      </div>
    </main>
    <footer>

        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2977.873378988072!2d44.72861177590222!3d41.72325107509566!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x404472d3be88b36d%3A0x17ea3794c9ca0579!2sITWorks!5e0!3m2!1sru!2sge!4v1794158650572!5m2!1sru!2sge"
        width="100%"

        allowfullscreen=""

        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

    </footer>

</html>
